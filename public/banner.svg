<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ICJIA Open Journal Systems documentation — six documents: three for managers, one for the journal administrator, one for the preprint server administrator, and one for developers.">
  <title>Open Journal Systems, on trial at ICJIA</title>

  <!--
    Palette and type are the site's own: navy ground, cream text, coral accent,
    Manrope for display. The coral bar along the top edge is the reading-progress
    indicator from the document pages, stopped part-way — the documents are drafts.

    Every text run is pinned with textLength/lengthAdjust so the image renders
    identically whether or not Manrope and Inter are installed. Change a string
    and the pinned width has to change with it, or the glyphs get stretched.
  -->
  <defs>
    <style>
      .display { font-family: Manrope, "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif; font-weight: 800; }
      .sans    { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
      .num     { font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#14202e"/>

  <!-- reading progress, partway across -->
  <rect x="0" y="0" width="408" height="5" fill="#f08a72"/>

  <!-- ── headline ── -->
  <text class="display" x="72" y="182" font-size="50" letter-spacing="-1.1" fill="#efe8da" textLength="313" lengthAdjust="spacingAndGlyphs">Open Journal</text>
  <text class="display" x="72" y="238" font-size="50" letter-spacing="-1.1" fill="#efe8da" textLength="394" lengthAdjust="spacingAndGlyphs">Systems, on trial</text>
  <text class="display" x="72" y="294" font-size="50" letter-spacing="-1.1" fill="#efe8da" textLength="179" lengthAdjust="spacingAndGlyphs">at ICJIA</text>

  <text class="sans" x="72" y="352" font-size="20" fill="#a8b2be" textLength="376" lengthAdjust="spacingAndGlyphs">Six working documents: what OJS, OPS</text>
  <text class="sans" x="72" y="380" font-size="20" fill="#a8b2be" textLength="357" lengthAdjust="spacingAndGlyphs">and the Research Hub are, how to run</text>
  <text class="sans" x="72" y="408" font-size="20" fill="#a8b2be" textLength="337" lengthAdjust="spacingAndGlyphs">the two on trial, how the server was</text>
  <text class="sans" x="72" y="436" font-size="20" fill="#a8b2be" textLength="294" lengthAdjust="spacingAndGlyphs">built, and how they fit together.</text>

  <!-- ── the shelf: one row per document, in the portal's order: define things
       first, end on the adoption question. One row is on three lines: only the
       first line shares a baseline with its minutes, so the short opening sits
       there and the rest runs the full column width below. The pitch is 62px,
       118px for that row, and the shelf starts 28px higher than it did with a
       two-line row, which keeps the developer row and the footer facts where
       they were. rsvg-convert renders text a little wider than a browser
       measures it (it ignores the pinned widths and the tracking), so keep any
       line that shares a baseline with its minutes under about 320 measured. ── -->
  <g>
    <rect x="704" y="76" width="424" height="1" fill="#2e4056"/>

    <text class="sans" x="704" y="98" font-size="15" fill="#a8b2be" textLength="98" lengthAdjust="spacingAndGlyphs">For managers</text>
    <text class="display" x="704" y="126" font-size="22" letter-spacing="-0.5" fill="#efe8da" textLength="277" lengthAdjust="spacingAndGlyphs">What is OJS? What is OPS?</text>
    <text class="sans num" x="1128" y="126" font-size="19" fill="#f08a72" text-anchor="end" textLength="62" lengthAdjust="spacingAndGlyphs">24 min</text>

    <rect x="704" y="138" width="424" height="1" fill="#2e4056"/>

    <text class="sans" x="704" y="160" font-size="15" fill="#a8b2be" textLength="98" lengthAdjust="spacingAndGlyphs">For managers</text>
    <text class="display" x="704" y="188" font-size="22" letter-spacing="-0.5" fill="#efe8da" textLength="277" lengthAdjust="spacingAndGlyphs">What is the Research Hub?</text>
    <text class="sans num" x="1128" y="188" font-size="19" fill="#f08a72" text-anchor="end" textLength="62" lengthAdjust="spacingAndGlyphs">34 min</text>

    <rect x="704" y="200" width="424" height="1" fill="#2e4056"/>

    <text class="sans" x="704" y="222" font-size="15" fill="#a8b2be" textLength="200" lengthAdjust="spacingAndGlyphs">For the journal administrator</text>
    <text class="display" x="704" y="250" font-size="22" letter-spacing="-0.5" fill="#efe8da" textLength="183" lengthAdjust="spacingAndGlyphs">How do I run OJS?</text>
    <text class="sans num" x="1128" y="250" font-size="19" fill="#f08a72" text-anchor="end" textLength="62" lengthAdjust="spacingAndGlyphs">11 min</text>

    <rect x="704" y="262" width="424" height="1" fill="#2e4056"/>

    <text class="sans" x="704" y="284" font-size="15" fill="#a8b2be" textLength="256" lengthAdjust="spacingAndGlyphs">For the preprint server administrator</text>
    <text class="display" x="704" y="312" font-size="22" letter-spacing="-0.5" fill="#efe8da" textLength="186" lengthAdjust="spacingAndGlyphs">How do I run OPS?</text>
    <text class="sans num" x="1128" y="312" font-size="19" fill="#f08a72" text-anchor="end" textLength="62" lengthAdjust="spacingAndGlyphs">11 min</text>

    <rect x="704" y="324" width="424" height="1" fill="#2e4056"/>

    <text class="sans" x="704" y="346" font-size="15" fill="#a8b2be" textLength="98" lengthAdjust="spacingAndGlyphs">For managers</text>
    <text class="display" x="704" y="374" font-size="22" letter-spacing="-0.5" fill="#efe8da" textLength="173" lengthAdjust="spacingAndGlyphs">Should we adopt</text>
    <text class="display" x="704" y="402" font-size="22" letter-spacing="-0.5" fill="#efe8da" textLength="181" lengthAdjust="spacingAndGlyphs">OJS and/or OPS —</text>
    <text class="display" x="704" y="430" font-size="22" letter-spacing="-0.5" fill="#efe8da" textLength="360" lengthAdjust="spacingAndGlyphs">and what about the Research Hub?</text>
    <text class="sans num" x="1128" y="374" font-size="19" fill="#f08a72" text-anchor="end" textLength="62" lengthAdjust="spacingAndGlyphs">27 min</text>

    <rect x="704" y="442" width="424" height="1" fill="#2e4056"/>

    <text class="sans" x="704" y="464" font-size="15" fill="#a8b2be" textLength="106" lengthAdjust="spacingAndGlyphs">For developers</text>
    <text class="display" x="704" y="492" font-size="22" letter-spacing="-0.5" fill="#efe8da" textLength="303" lengthAdjust="spacingAndGlyphs">How do I install OJS and OPS?</text>
    <text class="sans num" x="1128" y="492" font-size="19" fill="#f08a72" text-anchor="end" textLength="62" lengthAdjust="spacingAndGlyphs">53 min</text>

    <rect x="704" y="504" width="424" height="1" fill="#2e4056"/>
  </g>

  <!-- ── footer facts ── -->
  <rect x="72" y="528" width="1056" height="1" fill="#2e4056"/>
  <text class="sans" x="72" y="566" font-size="17" fill="#a8b2be" textLength="57" lengthAdjust="spacingAndGlyphs">Astro 7</text>
  <text class="sans" x="196" y="566" font-size="17" fill="#a8b2be" textLength="46" lengthAdjust="spacingAndGlyphs">Static</text>
  <text class="sans" x="310" y="566" font-size="17" fill="#7fc49b" textLength="107" lengthAdjust="spacingAndGlyphs">WCAG 2.1 AA</text>
  <text class="sans" x="480" y="566" font-size="17" fill="#a8b2be" textLength="68" lengthAdjust="spacingAndGlyphs">214 tests</text>
  <text class="sans" x="1128" y="566" font-size="17" fill="#a8b2be" text-anchor="end" textLength="159" lengthAdjust="spacingAndGlyphs">ojs-docs.netlify.app</text>
</svg>

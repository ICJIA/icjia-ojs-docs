[build]
  # Not just `npm run build`. Netlify publishes on every push to main, and a
  # required status check gates a *merge*, not a push — so a direct push to main
  # deployed here before CI had reported anything, and stayed deployed if CI
  # then went red. Only the release tag was gated on CI, never the deploy.
  #
  # Running the same three steps in the same order as ci.yml closes that: a
  # failing type check or test now fails the deploy instead of publishing. The
  # order matters — the build-output and screen-reader suites assert against
  # dist/ and build it themselves only if it is missing, so building before
  # testing means they read this build rather than racing to make their own.
  command = "npm run check && npm run build && npm test"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--include=dev"

# Static build: no adapter, no functions. Netlify reads .nvmrc for the Node version.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # The documents carry their own inline <style>, and one carries an inline
    # <script>, so script-src and style-src cannot drop 'unsafe-inline' without
    # build-time hashing. The rest is still worth having: nothing may be framed,
    # no <object>/<embed>, no <base> rewriting, and the only reachable origins
    # are the two Google Fonts hosts. Scripts are separately pinned by hash in
    # tests/document-scripts.test.ts.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

name: CI

# Runs the same three steps Netlify now runs on every deploy, in the same order.
# The duplication is deliberate: this reports on pull requests, before anything
# is merged, and it is what the release workflow waits on before tagging.
#
# Between them they hold the pins — the approved document scripts, the identical
# footers, and the guard against a personal name, an unexpected email address or
# a credential reaching published HTML. Those exist to catch a change nobody
# meant to make, which means they cannot depend on anyone remembering to run
# them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      # Build first: the build-output and screen-reader suites assert against
      # dist/, and build themselves only if it is missing. Building here means
      # they read this build rather than making a second one.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Confirm every document produced a page
        run: |
          set -euo pipefail
          missing=0
          for slug in $(node -e "
            const s = require('fs').readFileSync('src/content/documents.ts','utf8');
            for (const m of s.matchAll(/slug: '([^']+)'/g)) console.log(m[1]);
          "); do
            if [ -f "dist/docs/$slug/index.html" ]; then
              echo "  ok      $slug"
            else
              echo "  MISSING $slug"; missing=1
            fi
          done
          [ -f dist/index.html ] && echo "  ok      portal" || { echo "  MISSING portal"; missing=1; }
          exit $missing
